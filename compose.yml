services:
  mysql:
    image: mysql:8.4
    container_name: dev-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"  ##一般来说只写端口就好，写成127.0.0.1:3306:3306是为了只能本地访问，防止端口暴露在公共网段中
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: artifactweb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
